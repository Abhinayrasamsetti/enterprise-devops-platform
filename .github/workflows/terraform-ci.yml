name: Terraform CI

on:
  pull_request:
    paths:
      - "infrastructure/terraform/**"
  push:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Terraform Format
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform -chdir=infrastructure/terraform init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=infrastructure/terraform validate

      - name: Terraform Plan
        run: terraform -chdir=infrastructure/terraform plan -input=false || true

      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: infrastructure/terraform
