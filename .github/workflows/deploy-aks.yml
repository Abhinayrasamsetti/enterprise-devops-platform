name: Enterprise CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Repository Information
        run: |
          echo "======================================="
          echo "Enterprise DevOps Platform"
          echo "======================================="
          echo "Repository : ${{ github.repository }}"
          echo "Branch     : ${{ github.ref_name }}"
          echo "Commit      : ${{ github.sha }}"
          echo "Triggered By: ${{ github.actor }}"

      #########################################################
      # Terraform
      #########################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Format Check
        run: terraform fmt -recursive -check || true

      #########################################################
      # YAML Validation
      #########################################################

      - name: Validate YAML files
        run: |
          echo "Checking YAML files..."
          find . -type f \( -name "*.yml" -o -name "*.yaml" \)

      #########################################################
      # Markdown Validation
      #########################################################

      - name: Validate Markdown
        run: |
          echo "Checking Markdown files..."
          find . -type f -name "*.md"

      #########################################################
      # Helm Charts
      #########################################################

      - name: Check Helm Folder
        run: |
          if [ -d "helm" ]; then
            echo "Helm charts found."
          else
            echo "No Helm charts found."
          fi

      #########################################################
      # Kubernetes Manifests
      #########################################################

      - name: Check Kubernetes Folder
        run: |
          if [ -d "kubernetes" ]; then
            echo "Kubernetes manifests found."
          else
            echo "No Kubernetes manifests."
          fi

      #########################################################
      # Repository Structure
      #########################################################

      - name: Verify Repository Structure
        run: |
          echo "Checking expected folders..."

          for dir in terraform docs .github tests; do
            if [ -d "$dir" ]; then
              echo "✔ $dir"
            else
              echo "✘ Missing: $dir"
            fi
          done

      #########################################################
      # Security Summary
      #########################################################

      - name: Repository Summary
        run: |
          echo ""
          echo "======================================="
          echo "Enterprise CI Validation Completed"
          echo "======================================="
          echo "✔ Repository checked"
          echo "✔ Terraform verified"
          echo "✔ YAML checked"
          echo "✔ Markdown checked"
          echo "✔ Helm checked"
          echo "✔ Kubernetes checked"
          echo "======================================="
